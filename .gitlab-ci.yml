stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # DBC Integration Test Credentials (must be configured in GitLab CI/CD settings)
  DBC_TEST_USERNAME: ${DBC_USERNAME}
  DBC_TEST_PASSWORD: ${DBC_PASSWORD}
  DBC_TEST_AUTHTOKEN: ${DBC_AUTHTOKEN}

cache:
  paths:
    - .cache/pip

default:
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -e .
    - pip install coverage pytest pytest-cov

.pytest_with_cov:
  stage: test
  script:
    - python -m pytest tests/ -v --cov=src/deathbycaptcha --cov-report=term --cov-report=xml --junit-xml=report.xml
  artifacts:
    paths:
      - report.xml
      - coverage.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days

.pytest_with_cov_html:
  extends: .pytest_with_cov
  script:
    - python -m pytest tests/ -v --cov=src/deathbycaptcha --cov-report=term --cov-report=html --cov-report=xml --junit-xml=report.xml
  artifacts:
    paths:
      - htmlcov/
      - report.xml
      - coverage.xml

test:python3.10:
  extends: .pytest_with_cov
  image: python:3.10

test:python3.11:
  extends: .pytest_with_cov_html
  image: python:3.11

test:python3.12:
  extends: .pytest_with_cov
  image: python:3.12

test:python3.13:
  extends: .pytest_with_cov
  image: python:3.13

test:python3.14:
  extends: .pytest_with_cov
  image: python:3.14
  allow_failure: true

test:python3.15:
  extends: .pytest_with_cov
  image: python:3.15-rc
  allow_failure: true

# Optional: Run tests with different dependency versions
test:minimal_deps:
  stage: test
  image: python:3.11
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install requests==2.25.1 simplejson==3.17.2
    - pip install -e .
    - pip install pytest
  script:
    - python -m pytest tests/ -v --junit-xml=report.xml
  artifacts:
    paths:
      - report.xml
    reports:
      junit: report.xml
    expire_in: 30 days
