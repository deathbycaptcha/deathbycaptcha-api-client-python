name: Playwright Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  playwright-integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Display Python version
      run: python -V

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov playwright
        for attempt in 1 2 3; do
          if playwright install --with-deps chromium; then break; fi
          echo "Playwright install attempt $attempt failed, retrying in 20s"
          sleep 20
          if [ "$attempt" = "3" ]; then exit 1; fi
        done

    - name: Run Playwright integration tests
      env:
        DBC_TEST_USERNAME: ${{ secrets.DBC_USERNAME }}
        DBC_TEST_PASSWORD: ${{ secrets.DBC_PASSWORD }}
        DBC_PLAYWRIGHT_HEADLESS: "true"
        DBC_PLAYWRIGHT_PAGE_URL: "https://www.google.com/recaptcha/api2/demo"
      run: python -m pytest tests/test_playwright_integration.py -v

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: |
          report.xml
          coverage.xml
        retention-days: 30
