name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Verify package version matches tag
      if: github.event_name == 'release'
      run: |
        RELEASE_TAG="${GITHUB_REF#refs/tags/}"
        # Remove 'v' prefix if present
        VERSION="${RELEASE_TAG#v}"
        
        # Extract version from pyproject.toml
        PACKAGE_VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
        
        echo "Release tag: $RELEASE_TAG"
        echo "Package version: $PACKAGE_VERSION"
        
        if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
          echo "ERROR: Release tag ($VERSION) does not match package version ($PACKAGE_VERSION)"
          exit 1
        fi
        echo "Version check passed: $VERSION"
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Publish package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "ERROR: PYPI_API_TOKEN secret is not configured"
          echo "Please add PYPI_API_TOKEN to repository secrets"
          exit 1
        fi
        twine upload dist/*
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 90
